name: Build Auto Cash Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Config and Install Dependencies
        run: |
          # التأكد من وجود ملفات التكوين الصحيحة لـ Capacitor
          if [ ! -f "capacitor.config.json" ]; then
            echo '{
              "appId": "com.autocash.management",
              "appName": "Auto Cash",
              "webDir": ".",
              "server": { "androidScheme": "https" }
            }' > capacitor.config.json
          fi

          if [ ! -f "package.json" ]; then
            echo '{
              "name": "auto-cash-app",
              "version": "2.0.0",
              "dependencies": {
                "@capacitor/core": "^6.0.0",
                "@capacitor/android": "^6.0.0",
                "@capacitor/app": "^6.0.0"
              },
              "devDependencies": {
                "@capacitor/cli": "^6.0.0"
              }
            }' > package.json
          fi

          npm install --legacy-peer-deps

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap update android
          npx cap sync android

      - name: Grant Gradle Execution Rights & Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCash-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
